# Starts a real Jenkins controller on a GitHub runner, lets it run the Jenkinsfile,
# and publishes the screenshots, logs and report to the "evidence" branch.
name: Jenkins pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jenkins:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools for screenshot capture
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Start Jenkins
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          REPO_BRANCH: ${{ github.ref_name }}
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export JENKINS_ADMIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$JENKINS_ADMIN_PASSWORD"
          echo "JENKINS_ADMIN_PASSWORD=$JENKINS_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          ./jenkins/start-jenkins.sh

      - name: Wait for the pipeline and capture evidence
        run: node scripts/capture-jenkins.js

      - name: Build single-file Allure report
        if: always()
        run: |
          mkdir -p evidence
          docker logs jenkins > evidence/jenkins-server.log 2>&1 || true
          if [ -f evidence/jenkins-artifacts.zip ]; then
            unzip -q evidence/jenkins-artifacts.zip -d /tmp/artifacts
            npx allure generate /tmp/artifacts/archive/allure-results --single-file --clean -o evidence/allure-report || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: evidence/

      - name: Publish evidence branch
        if: always()
        run: |
          cd evidence
          git init -q -b evidence
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Evidence for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" evidence
