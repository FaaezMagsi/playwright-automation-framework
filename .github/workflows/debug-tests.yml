name: Debug tests
on:
  push:
    branches: [main]
    paths: ['.github/workflows/debug-tests.yml', 'tests/**', 'pages/**', 'utils/**', 'fixtures/**', 'data/**']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pw .
      - run: mkdir out && docker run --name pwdebug --ipc=host pw > out/run.log 2>&1 || true
      - if: always()
        run: |
          docker cp pwdebug:/app/test-results out/ || true
          cd out && git init -q -b debug && git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm debug && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" debug
