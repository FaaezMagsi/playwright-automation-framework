# Application under test: Toolshop's published images (github.com/testsmith-io/practice-software-testing).
name: toolshop
services:
  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DISABLE_LOGGING: "true"
    depends_on: [mariadb]
  web:
    build:
      context: ./app
      dockerfile: web.Dockerfile
    ports: ["8091:80"]
    depends_on: [laravel-api]
  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    ports: ["4200:4200"]
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop
